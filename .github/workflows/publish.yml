name: Publish

# Pushing a version tag (v0.2.0) publishes that build to the Chrome Web Store.
# The manual trigger defaults to upload-only, which stages a draft in the
# developer dashboard without publishing it. Publishing is gated on the verify
# job: nothing reaches the store unless typecheck, tests, and the build pass.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      action:
        description: "Store operation"
        type: choice
        options: [upload, publish]
        default: upload

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm build

      - name: Check the tag matches the manifest version
        if: github.ref_type == 'tag'
        run: |
          version=$(node -p "require('./manifests/base.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match manifest version $version" >&2
            exit 1
          fi

  publish-chrome:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm pack:chrome

      - uses: wdzeng/chrome-extension@v2
        with:
          extension-id: cgibooiickogggdkhpbmflgookgjpbnl
          zip-path: dist/offline-tldr-chrome-*.zip
          publisher-id: ${{ secrets.PUBLISHER_ID }}
          client-id: ${{ secrets.CHROME_CLIENT_ID }}
          client-secret: ${{ secrets.CHROME_CLIENT_SECRET }}
          refresh-token: ${{ secrets.CHROME_REFRESH_TOKEN }}
          action: ${{ github.event_name == 'push' && 'publish' || inputs.action }}
